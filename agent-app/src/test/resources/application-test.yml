# Tests never call a model API: no chat model is created here, and StubChatModelConfiguration
# supplies the only ChatModel bean.
spring:
  ai:
    model:
      chat: none
    openai:
      api-key: not-used-in-tests
  datasource:
    # Replaced by the Testcontainers @ServiceConnection; set only so the main placeholder resolves.
    password: not-used-in-tests

# Scheduler polls fast so asynchronous engine tests finish in milliseconds, not seconds.
db-scheduler:
  polling-interval: 100ms
  heartbeat-interval: 1s

# The same secret MockApps gives the mock CRM, so tokens issued here pass its check.
approval:
  token:
    secret: test-approval-secret-0123456789abcdef

workflow:
  # Engine and intake tests bring fake steps; a test that needs the real ones turns this on itself.
  real-steps: false
  engine:
    retry-backoff-base: 50ms
  # Tests call the poller and the relay directly; timers would race with their assertions.
  intake:
    poll-enabled: false
  outbox:
    relay-enabled: false
