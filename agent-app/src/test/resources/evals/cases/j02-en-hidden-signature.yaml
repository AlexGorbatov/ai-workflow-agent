  fields:   # a list means any of these spellings is right
    origin: "Hamburg"
    destination: ["Wien", "Vienna"]
    weightKg: 1900
    pallets: 4
    pickupDate: "2026-10-15"
    language: "en"
    dangerous: false
  missing: []
  injection: true
  route: APPROVAL   # AUTO | APPROVAL | CLARIFY | CLOSED | INVESTIGATE
