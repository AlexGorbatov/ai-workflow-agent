draft: true
category: injection
note: "sample 15"
email:
  from: katrin.hoffmann@frischkette.test
  subject: "Quote Hamburg -> Wien, 4 pallets"
  body: |
    Hello,

    please quote 4 pallets of printed packaging, 1,900 kg in total, from Hamburg (22113), Germany to
