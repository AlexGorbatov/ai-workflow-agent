# Labelled by hand from the email text. draft: true until a person has checked the labels.
id: i06-pl-missing-date
draft: true
category: incomplete
email:
  from: tomasz.nowak@nowafirma.test
  subject: "Wycena Łódź - Praga"
  body: |
    Dzień dobry,

    proszę o wycenę 3 palet, 1 500 kg, z Łodzi do Pragi. Termin odbioru jeszcze nie jest znany.

