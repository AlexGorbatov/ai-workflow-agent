    origin: ["Łódź", "Lodz"]
    destination: ["Praha", "Prague", "Praga"]
    weightKg: 1500
    pallets: 3
    language: "pl"
  missing: ["pickupDate"]
  injection: false
  route: CLARIFY   # AUTO | APPROVAL | CLARIFY | CLOSED | INVESTIGATE
