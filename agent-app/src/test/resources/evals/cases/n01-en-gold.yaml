# Labelled by hand from the email text. draft: true until a person has checked the labels.
id: n01-en-gold
draft: true
category: normal
note: "sample 01"
email:
  from: anna.kowalska@polmarket.test
  subject: "Quote request: 12 pallets Warsaw -> Berlin"
  body: |
    Hello Nordline team,

    could you please quote the following shipment:

    - 12 Euro pallets of household goods, total weight 7,200 kg, not stackable
    - Pickup: Tuesday, 6 October 2026, our warehouse in Warszawa (02-222), Poland
    - Delivery: Berlin (12057), Germany, by 7 October

    No dangerous goods, no temperature control needed.

    Best regards,
    Anna Kowalska
    Logistics Coordinator, PolMarket Sp. z o.o.
fixtures:
  customer: GOLD   # GOLD | STANDARD | NEW | CREDIT_HOLD | AMBIGUOUS (what Enrich would find)
  cost: 487.6   # carrier cost the rates would return, EUR
expect:
  intent: QUOTE_REQUEST
  fields:   # a list means any of these spellings is right
    origin: ["Warszawa", "Warsaw"]
    destination: "Berlin"
    weightKg: 7200
    pallets: 12
    pickupDate: "2026-10-06"
    language: "en"
    dangerous: false
  missing: []
  injection: false
  route: AUTO   # AUTO | APPROVAL | CLARIFY | CLOSED | INVESTIGATE
