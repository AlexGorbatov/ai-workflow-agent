    destination: "Madrid"
    weightKg: 21000
    pallets: 30
    pickupDate: "2026-10-26"
    language: "en"
    dangerous: false
  missing: []
  injection: false
  route: APPROVAL   # AUTO | APPROVAL | CLARIFY | CLOSED | INVESTIGATE
