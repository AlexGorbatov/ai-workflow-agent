# Labelled by hand from the email text. draft: true until a person has checked the labels.
id: n19-en-heavy
draft: true
category: normal
note: "LARGE_REQUEST by weight (>= 20 t)"
email:
  from: erik.lindqvist@baltictimber.test
  subject: "Heavy load Gothenburg - Madrid"
  body: |
    Hello,

    please quote 30 pallets of steel parts, 21 t in total, from Gothenburg to Madrid.
