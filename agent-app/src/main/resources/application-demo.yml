# Demo profile: active in spring-boot:test-run, never in the automated test suite.
# It does not change the model. Later milestones add the Mailpit inbox poller (M1) and short timers
# (follow-up after minutes instead of days, M6) here.
logging:
  level:
    com.altronixsoft.workflow: DEBUG

# Every trace in the demo, exported to the local otel-lgtm (docker compose up -d lgtm).
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: true
